name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange the app source
        run: |
          mkdir -p _keep/lib/pages
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d _src
            SRC=$(dirname "$(find _src -name pubspec.yaml | head -1)")
            cp -r "$SRC/lib/." _keep/lib/
            cp "$SRC/pubspec.yaml" _keep/pubspec.yaml
          elif [ -d lib ] && [ -f pubspec.yaml ]; then
            cp -r lib/. _keep/lib/
            cp pubspec.yaml _keep/pubspec.yaml
          elif [ -f main.dart ] && [ -f pubspec.yaml ]; then
            echo "Files are flat in the repo root. Placing them into lib and lib/pages."
            cp main.dart config.dart _keep/lib/
            for f in *.dart; do
              if [ "$f" != "main.dart" ] && [ "$f" != "config.dart" ]; then
                cp "$f" _keep/lib/pages/
              fi
            done
            cp pubspec.yaml _keep/pubspec.yaml
          else
            echo "No app source found."
            ls -la
            exit 1
          fi
          ls -R _keep
      - name: Create the Android project
        run: flutter create --platforms=android --org com.grandaurum --project-name grand_aurum .
      - name: Put the Grand Aurum code in place of the demo app
        run: |
          rm -rf lib test pubspec.yaml
          cp -r _keep/lib lib
          cp _keep/pubspec.yaml pubspec.yaml
          ls lib lib/pages
      - name: Allow internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: grand-aurum-apk
          path: build/app/outputs/flutter-apk/app-release.apk
