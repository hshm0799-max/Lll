name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create the Android project
        run: flutter create --platforms=android --org com.grandaurum --project-name grand_aurum .
      - name: Replace the demo app with Grand Aurum
        run: |
          unzip -q -o grand-aurum-flutter.zip -d _src
          rm -rf lib test
          cp -r _src/grand_aurum/lib ./lib
          cp _src/grand_aurum/pubspec.yaml ./pubspec.yaml
          ls lib lib/pages
      - name: Allow internet
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: grand-aurum-apk
          path: build/app/outputs/flutter-apk/app-release.apk
